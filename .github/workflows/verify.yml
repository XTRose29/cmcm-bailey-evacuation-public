name: Verify published research package
on: [push, pull_request]
jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements-paper.txt
      - run: python scripts/verify_release.py
      - run: python web_v2/scripts/build.py --check
      - run: python -m compileall -q model_v2
      - run: node --check web_v2/src/app.js
